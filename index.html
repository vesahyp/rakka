<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1a10" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-512.png" type="image/png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Räkkä</title>
    <meta name="description" content="Selviytymispeli suomalaisessa metsässä. Yksi peukalo, hyttysparvet, Kalevalan sankarit. Puhelimen selaimessa, ilmaiseksi." />
    <!-- Link previews (WhatsApp, Telegram, Slack read these). Absolute URLs
         are required; the image is 1200 by 630. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Räkkä" />
    <meta property="og:title" content="Räkkä" />
    <meta property="og:description" content="Selviytymispeli suomalaisessa metsässä. Yksi peukalo, hyttysparvet, Kalevalan sankarit. Puhelimen selaimessa, ilmaiseksi." />
    <meta property="og:url" content="https://vesahyp.github.io/rakka/" />
    <meta property="og:image" content="https://vesahyp.github.io/rakka/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fi_FI" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Räkkä" />
    <meta name="twitter:description" content="Selviytymispeli suomalaisessa metsässä. Yksi peukalo, hyttysparvet, Kalevalan sankarit." />
    <meta name="twitter:image" content="https://vesahyp.github.io/rakka/og.png" />
    <!-- Analytics: the clavesa tracker (vendored unmodified from
         clavesa-dev/web-tracker) beacons to a 1x1 GIF on our CloudFront; its
         access logs are the datastore. See TRACKING.md. The pixel URL is
         VITE_PIXEL_URL at build time (src/config.ts says where it lives); a
         build without one sends nothing. Off on localhost and for the ?bot=1
         screenshot runs, so our own traffic never counts. -->
    <script>
      window.TRACKER_CONFIG = {
        endpoint: "%VITE_PIXEL_URL%",
        enabled: /^https:/.test("%VITE_PIXEL_URL%") && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]bot=1/.test(location.search)
      };
    </script>
    <script defer src="/tracker.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
